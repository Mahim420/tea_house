<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>

    <!--Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- Font Awsome Icon -->
    <script src="https://kit.fontawesome.com/404f9860a3.js" crossorigin="anonymous"></script>

    <!-- Tailwind CSS config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                    }
                }
            }
        }
    </script>
</head>

<body>
    <main class="max-w-screen-xl mx-auto px-10 lg:px-16">
        <!-- Header Section -->
        <header class="md:flex pt-10 mb-20">
            <!-- text Content -->
            <div>
                <h1 class="text-3xl md:text-7xl lg:font-semibold">It's good<br>
                    tea time at The <br>Tea House</h1> <br>
                <p class="text-gray-500 w-3/4">Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your
                    Taste
                    Buds.</p> <br>
                <button
                    class="bg-gradient-to-r from-orange-500 to-red-500 px-5 py-3 rounded-lg text-white font-bold">Explore
                    More
                    <i class="fa-solid fa-arrow-right text-xl -rotate-45"></i>
                </button>
            </div>
            <!-- Image Content -->
            <div class="relative">
                <!-- Image -->
                <div class="mt-6">
                    <img src="./images/banner.png" class="w-full"
                        alt="two cold beverages, likely bubble tea or fruit teas from Gong Cha or a similar brand. From left to right:">
                </div>
                <!-- Card Image -->
                <div
                    class="flex absolute top-64 md:top-80 lg:top-96 md:left-16 lg:left-24 items-center bg-white shadow-lg px-2 py-2 md:px-10 lg:py-4 rounded-lg">
                    <!-- Image -->
                    <div>
                        <i class="fa-solid fa-star text-3xl text-amber-500"></i>
                    </div>
                    <!-- Text -->
                    <div class="ml-3">
                        <h2 class="lg:text-2xl font-bold">5.00</h2>
                        <p class="text-gray-500">Trust Pilot Ratings</p>
                    </div>
                </div>
            </div>
        </header>
    </main>
</body>

</html>
